name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # The full suite stays on Ubuntu. UI tests use Avalonia.Headless and do not
    # need a display; the image codec smoke below also runs on Windows and macOS.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins the exact SDK, so there is nothing to keep in step
          # between here and a developer's machine.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore yappynotes.sln

      - name: Build
        # Warnings are treated as something you introduced rather than as errors
        # in day-to-day work, but a pull request should not add one unnoticed.
        run: dotnet build yappynotes.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test yappynotes.sln --configuration Release --no-build --verbosity normal

      - name: Check formatting
        run: dotnet format yappynotes.sln --verify-no-changes --no-restore

  image-codecs:
    # Cross-publishing does not load platform codecs. Decode real fixtures on
    # each OS with the Skia renderer used by the desktop app.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Decode image fixtures
        run: dotnet test tests/YappyNotes.App.Tests/YappyNotes.App.Tests.csproj --configuration Release --filter 'FullyQualifiedName~ImageCodecSmokeTests' --verbosity normal

  package:
    # Proves the thing a reader would actually download still builds, on every
    # platform it claims to support. Cross-publishing from Linux shows the files
    # were produced; running the archive is a separate question and belongs to a
    # release, not to every push.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package ${{ matrix.rid }}
        run: scripts/package.sh ${{ matrix.rid }}

  installer:
    # The Linux installer only, as a check that scripts/package-installer.sh and
    # vpk still agree. Windows and macOS installers can only be packed on their own
    # runners, which is the release workflow's job rather than every push's.
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack the linux-x64 installer
        run: scripts/package-installer.sh linux-x64
